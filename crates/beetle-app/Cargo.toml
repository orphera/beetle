[package]
name = "beetle-app"
version = "0.1.0"
edition = "2021"
description = "Main application binary for Beetle BMS Player"

[dependencies]
beetle-core = { workspace = true }
beetle-audio = { workspace = true }
beetle-render = { workspace = true }
bms-package = { workspace = true }
winit = { workspace = true }
rtrb = { workspace = true }

[features]
default = ["bga-enhanced"]
bga-enhanced = ["beetle-render/bga-enhanced"]

[dev-dependencies]
bms-package-manager = { workspace = true }
hound = { workspace = true }
