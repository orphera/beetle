[package]
name = "beetle-render"
version = "0.1.0"
edition = "2021"
description = "Direct3D 11 2D renderer, text engine and generated skin for the Beetle player"

[dependencies]
beetle-core = { workspace = true }
beetle-audio = { workspace = true }
bms-package = { workspace = true }
fontdue = { workspace = true }
png = { workspace = true, optional = true }
jpeg-decoder = { workspace = true, optional = true }

[features]
default = []
bga-enhanced = ["png", "jpeg-decoder"]
