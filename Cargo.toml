[workspace]
members = [
    "crates/beetle-core",
    "crates/beetle-audio",
    "crates/beetle-render",
    "crates/beetle-app",
    "crates/bms-package",
    "crates/bms-package-manager",
]
resolver = "2"

[workspace.dependencies]
# Internal crates
beetle-core = { path = "crates/beetle-core" }
beetle-audio = { path = "crates/beetle-audio" }
beetle-render = { path = "crates/beetle-render" }
bms-package = { path = "crates/bms-package" }
bms-package-manager = { path = "crates/bms-package-manager" }

# External dependencies (kept minimal for binary size)
cpal = "0.15"
rtrb = "0.3"
hound = "3.5"
lewton = "0.10"
tiny-skia = "0.11"
winit = "0.30"
softbuffer = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
