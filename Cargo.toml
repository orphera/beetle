[workspace]
members = [
    "crates/beetle-core",
    "crates/beetle-audio",
    "crates/beetle-render",
    "crates/beetle-app",
]
resolver = "2"

[workspace.dependencies]
# Internal crates
beetle-core = { path = "crates/beetle-core" }
beetle-audio = { path = "crates/beetle-audio" }
beetle-render = { path = "crates/beetle-render" }

# External dependencies (kept minimal for binary size)
cpal = "0.15"
rtrb = "0.3"
hound = "3.5"
lewton = "0.10"
tiny-skia = "0.11"
winit = "0.30"
softbuffer = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
